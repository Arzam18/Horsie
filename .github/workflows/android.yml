name: Horsie

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Patch NEON constexpr bit_cast issue
        run: |
          sed -i 's/alignas(64) constexpr std::array<vec_128i, 256> nnzTable/alignas(64) const std::array<vec_128i, 256> nnzTable/' src/nnue/nn.cpp

      - name: Build
        run: |
          make native \
              CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++ \
              IS_ARM=1 \
              CXXFLAGS_NATIVE="-march=armv8.2-a+dotprod -DARM" \
              LDFLAGS="-pthread -static-libstdc++" \
              CXXFLAGS="-std=c++20 -g -O3 -DNDEBUG -DEVALFILE=\\\"net-015-2048x16x32-132qb-z-p0.bin\\\" -funroll-loops -fexperimental-library"

      - name: List build output
        run: |
          find . -maxdepth 1 -type f -executable

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: horsie-android-arm64
          path: horsie

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Horsie Build ${{ github.run_number }}
          prerelease: true
          files: horsie
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
